services:
  db:
    image: docker.io/pgvector/pgvector:pg17
    container_name: garage-pg-dev
    environment:
      POSTGRES_USER: garage
      POSTGRES_PASSWORD: garage
      POSTGRES_DB: garage
    ports:
      - "127.0.0.1:5432:5432" # Mở port để bạn có thể dùng DBeaver/psql kết nối vào soi DB
    volumes:
      - garage-pg-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U garage -d garage"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: dockerfile
    container_name: garage-web-dev
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 127.0.0.1 --port 8000 --reload"
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+psycopg://garage:garage@db:5432/garage
    volumes:
      - .:/app # QUAN TRỌNG: Mount toàn bộ code ngoài máy vào container để khi sửa code là server reload ngay
    depends_on:
      db:
        condition: service_healthy

volumes:
  garage-pg-dev-data:
