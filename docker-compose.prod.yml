services:
  db:
    image: docker.io/pgvector/pgvector:pg17
    container_name: garage-pg-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-garage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-garage}
      POSTGRES_DB: ${POSTGRES_DB:-garage}
    volumes:
      - garage-pg-prod-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-garage} -d ${POSTGRES_DB:-garage}" ]
      interval: 10s
      retries: 5

  web:
    build:
      context: .
      dockerfile: dockerfile
    container_name: garage-web-prod
    restart: always
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4"
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-garage}:${POSTGRES_PASSWORD:-garage}@db:5432/${POSTGRES_DB:-garage}
    depends_on:
      db:
        condition: service_healthy

volumes:
  garage-pg-prod-data:
