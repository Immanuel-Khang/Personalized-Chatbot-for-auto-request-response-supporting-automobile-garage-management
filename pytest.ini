[pytest]
testpaths = tests
# Mặc định KHÔNG chạy test gọi LLM thật (tốn tiền). Chạy: RUN_LLM_TESTS=1 pytest tests/test_l5_benchmark.py -m llm
addopts = -m "not llm"
markers =
    llm: gọi LLM thật (chỉ chạy khi RUN_LLM_TESTS=1, tốn tiền)
    slow: chậm (đồng thời, E2E, benchmark lặp)
    e2e: hành trình E2E L6 (tests/test_e2e.py): chạy riêng bằng pytest -m e2e
# langsmith (thư viện bên thứ ba) dùng asyncio.iscoroutinefunction, bị loại bỏ ở Python 3.16: chưa phải lỗi của project.
filterwarnings =
    ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:langsmith.*
